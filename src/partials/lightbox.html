<dialog class="lightbox" data-lightbox aria-label="Просмотр фотографий">
  <button class="lightbox-close" type="button" data-lightbox-close aria-label="Закрыть">
    <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
  </button>
  <button class="lightbox-prev" type="button" data-lightbox-prev aria-label="Предыдущее фото">
    <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
  </button>
  <figure>
    <img data-lightbox-img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="">
    <figcaption data-lightbox-caption></figcaption>
  </figure>
  <button class="lightbox-next" type="button" data-lightbox-next aria-label="Следующее фото">
    <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
  </button>
  <div class="lightbox-count" data-lightbox-count></div>
</dialog>
