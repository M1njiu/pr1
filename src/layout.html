<!doctype html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <link rel="canonical" href="{{CANONICAL}}">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Пивоварня «Тарусский гусь»">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">

  <meta name="theme-color" content="#0a1e17">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preload" href="assets/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
  <noscript>
    <style>
      @media (max-width: 1060px) {
        .menu-btn { display: none !important; }
        .mobile-menu {
          position: static;
          display: block;
          height: auto;
          padding: 0 var(--gutter) 14px;
          opacity: 1;
          visibility: visible;
          transform: none;
          background: var(--cream);
          border-bottom: 1px solid var(--line);
          overflow: visible;
        }
        .mobile-menu nav { flex-direction: row; flex-wrap: wrap; gap: 4px 20px; }
        .mobile-menu nav a {
          padding: 7px 0;
          border: 0;
          font-family: var(--font-body);
          font-size: 0.82rem;
          font-weight: 700;
        }
        .mobile-menu nav a::after { display: none; }
        .mobile-menu__foot { display: none; }
      }
    </style>
  </noscript>
</head>
<body class="{{BODY_CLASS}}">
  <svg class="svg-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.4 3h3.1l1.5 4-2 1.5a12.5 12.5 0 0 0 6.5 6.5l1.5-2 4 1.5v3.1c0 1.4-1.1 2.4-2.5 2.4C10.2 20 4 13.8 4 5.5 4 4.1 5 3 6.4 3Z"/></symbol>

    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-keg" viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="15" rx="3"/><path d="M6 9h12M6 16h12M9 5V3h6v2M18 11h2v3h-2"/></symbol>
    <symbol id="i-bottle" viewBox="0 0 24 24"><path d="M9.5 2.5h5v5c0 1.3 1 2 1 3.5v9a2.5 2.5 0 0 1-2.5 2.5h-2A2.5 2.5 0 0 1 8.5 20v-9c0-1.5 1-2.2 1-3.5v-5Z"/><path d="M9.5 4.5h5"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  {{AGE_GATE}}

  <a class="skip-link" href="#main">Перейти к содержанию</a>

  {{HEADER}}

  <main id="main">{{BODY}}</main>

  {{FOOTER}}

  {{LIGHTBOX}}

  <script src="assets/js/main.js" defer></script>
</body>
</html>
